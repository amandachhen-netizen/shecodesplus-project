<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10+Charted&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
<title>Weather application</title>
</head>
<body>
    <div class="weather-application">
        <header>
            <form class="search-form" id="searchForm">
                <input type="search" placeholder="Enter a city" required class="search-form-input" id="searchACity"/>
                <input type="submit" value="Search" class="search-form-submit" />
            </form>
        </header>
        <main> 
            <h1 id="displayCity">
                Melbourne
            </h1> 
            <div class="current-temperature-container">
                <div class="current-temperature-emoji">
                    ⛅
                </div>
                <div class="current-temperature">
                    <span id="current-temperature">
                        17°C
                    </span>
                </div>
            </div>
            <h2>
                Sunday 15:52, overcast and sunny
            </h2>
            <p class="current-weather-details">
                Humidity: <strong>60%</strong>
                <br/>
                Wind speed: <strong>10 km/h</strong>
                <br />
                Current UV level: <strong>5</strong>
                <br/>
                Maximum UV level: <strong>8</strong> 
            </p>    
        </main>
        <footer>
        This project is coded by 
        <a href="https://github.com/amandachhen-netizen" target="_blank">Amanda</a>, is 
        <a href="https://github.com/amandachhen-netizen/shecodesplus-project" target="_blank">open-sourced on GitHub</a> and 
        <a href="https://www.netlify.com/" target="_blank">hosted on Netlify</a>
        </footer>
    </div>
    <script src="src/index.js"></script>
</body>
</html>
